name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookstore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          JWT_ACCESS_SECRET: ci-access-secret-min-8
          JWT_REFRESH_SECRET: ci-refresh-secret-min-8
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bookstore_ci?schema=public
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bookstore_ci?schema=public
